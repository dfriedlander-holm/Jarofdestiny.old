<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Name Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Random Name Picker</h1>

        <!-- Input fields for entering names -->
        <div class="name-inputs">
            <h3>Enter 10 Names:</h3>
            <div class="input-grid">
                <input type="text" id="name1" placeholder="Person 1" maxlength="20">
                <input type="text" id="name2" placeholder="Person 2" maxlength="20">
                <input type="text" id="name3" placeholder="Person 3" maxlength="20">
                <input type="text" id="name4" placeholder="Person 4" maxlength="20">
                <input type="text" id="name5" placeholder="Person 5" maxlength="20">
                <input type="text" id="name6" placeholder="Person 6" maxlength="20">
                <input type="text" id="name7" placeholder="Person 7" maxlength="20">
                <input type="text" id="name8" placeholder="Person 8" maxlength="20">
                <input type="text" id="name9" placeholder="Person 9" maxlength="20">
                <input type="text" id="name10" placeholder="Person 10" maxlength="20">
            </div>
        </div>

        <!-- Save names button -->
        <button onclick="saveNames()">Save Names</button>

        <!-- Button to pick a random name -->
        <button id="pickButton" onclick="pickRandomName()">Pick Random Name</button>

        <div class="picked-result">
            <p id="pickedName"></p>
        </div>

        <!-- List of all people picked -->
        <div class="picked-list">
            <h3>All People Picked:</h3>
            <ul id="allPickedList"></ul>
        </div>

        <!-- Reset button -->
        <button onclick="resetPicker()">Reset</button>

        <!-- Statistical Analysis Section -->
        <div class="statistical-analysis">
            <h3>Statistical Analysis (1000 Runs Test)</h3>
            <button id="runAnalysisButton" onclick="runStatisticalAnalysis()">Run 1000 Random Picks</button>
            <div id="analysisResults"></div>
        </div>

        <!-- Details Section - Moved to bottom -->
        <div class="details-section">
            <h3>Details</h3>
            
            <!-- Slider for percentage reduction -->
            <div class="percentage-reduction">
                <label for="reduction">Set Percentage Reduction:</label>
                <input type="range" id="reduction" min="0" max="100" value="75" oninput="updateReductionLabel(this.value)">
                <span id="reductionLabel">75%</span>
            </div>

            <!-- Display grid for names and weights -->
            <div class="display-grid" id="nameGrid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
